spring.application.name=job-application-manager



# The connection URL for your database (change localhost and database_name as needed)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:application_manager_db}

# Database credentials
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Optional: Prints SQL queries to the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

